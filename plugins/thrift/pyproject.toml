[project]
name = "thriftctx"
version = "0.1.0"
description = "Local, project-specific code retrieval for Claude Code (BM25 over symbol chunks)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",  # v1 FastMCP API; 2.x renamed it (MCPServer)
    "pathspec>=0.12",
    "tree-sitter>=0.23,<0.26",  # 0.26.0 segfaults while chunking (seen on rich/_inspect.py)
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
]

[project.scripts]
thriftctx = "thriftctx.cli:main"
thriftctx-mcp = "thriftctx.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thriftctx"]
